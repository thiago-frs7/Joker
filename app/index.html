<!DOCTYPE html>
<html lang="pt-BR" data-tema="escuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#100D0A">
<meta name="description" content="ÂMBAR — RPG da vida real. Nada que você conquistou pode ser tirado de você.">
<title>ÂMBAR</title>
<link rel="stylesheet" href="css/ambar.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23100D0A'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23E8A33D'/%3E%3C/svg%3E">
</head>
<body>

<div id="app">
  <header class="topo">
    <div class="camada">Camada <b id="t-camada">1</b></div>
    <div class="barra-camada"><i id="t-barra" style="width:0%"></i></div>
    <div class="saldo" id="t-saldo">0 🩸</div>
  </header>

  <main>
    <section class="tela on" id="tela-hoje"></section>
    <section class="tela" id="tela-arvore"></section>
    <section class="tela" id="tela-herbario"></section>
    <section class="tela" id="tela-estufa"></section>
    <section class="tela" id="tela-estrato"></section>
  </main>

  <nav id="nav">
    <button data-t="hoje"     aria-current="true"><span class="g" data-ico="hoje"></span>Hoje</button>
    <button data-t="arvore"><span class="g" data-ico="arvore"></span>Árvore</button>
    <button data-t="herbario"><span class="g" data-ico="herbario"></span>Herbário</button>
    <button data-t="estufa"><span class="g" data-ico="estufa"></span>Estufa</button>
    <button data-t="estrato"><span class="g" data-ico="estrato"></span>Estrato</button>
  </nav>
</div>

<!-- Selagem: foco manual -->
<div id="selagem">
  <div class="frasco"><div class="liq" id="sel-liq"></div></div>
  <div class="t" id="sel-t">25:00</div>
  <div class="m" id="sel-m">a resina escorre enquanto você fica</div>
  <div class="mult" id="sel-mult">×1,00</div>
  <button class="sair" id="sel-sair">encerrar e guardar o que já endureceu</button>
</div>

<!-- Celebração -->
<div id="celebra">
  <div>
    <div class="gota"><div class="d"></div><div class="n" id="cel-n"></div></div>
    <h2 id="cel-t"></h2>
    <p id="cel-p"></p>
    <div class="dica">toque para continuar</div>
  </div>
</div>

<div id="lampo" title="pirilampo">✨</div>
<div id="torrada"></div>

<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/ui.js"></script>
<script src="js/telas.js"></script>
<script src="js/app.js"></script>
</body>
</html>
